name: Deploy to VPS

on:
  push:
    branches: [feature/tienda-medusa]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_CI_KEY }}
          script: echo "deploy triggered"
