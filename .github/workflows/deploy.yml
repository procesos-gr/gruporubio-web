name: Deploy to VPS

on:
  push:
    branches: [feature/tienda-medusa]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Decode SSH key
        run: |
          echo "${{ secrets.VPS_CI_KEY_B64 }}" | base64 -d > "${{ github.workspace }}/vps_ci_key"
          chmod 644 "${{ github.workspace }}/vps_ci_key"
      - name: Trigger deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key_path: vps_ci_key
          script: echo "deploy triggered"
      - name: Remove SSH key
        if: always()
        run: rm -f "${{ github.workspace }}/vps_ci_key"
